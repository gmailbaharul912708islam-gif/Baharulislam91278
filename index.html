    /* ====== LEFT SIDE MOVING LED ROUND (NO ROTATION) ====== */
    .site-name-led-round {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4px 16px 4px 14px;
      border-radius: 40px;
      background: #000;
      border: 2px solid #1a1a1a;
      box-shadow: 0 0 20px rgba(0, 255, 100, 0.1), 0 0 40px rgba(0, 200, 255, 0.05);
      min-height: 32px;
      overflow: hidden;
    }
    /* LED border - left side moving only */
    .site-name-led-round::before {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50px;
      background: conic-gradient(from 0deg, #00ff00 0deg 40deg, #00ffff 90deg 130deg, #ffff00 180deg 220deg, #ff00ff 270deg 310deg, #00ff00 360deg);
      animation: ledLeftMove 3s linear infinite;
      z-index: -1;
      padding: 4px;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
    }
    /* Glow effect - left side moving */
    .site-name-led-round::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50px;
      background: conic-gradient(from 30deg, rgba(0,255,0,0.15) 0deg 30deg, rgba(0,255,255,0.15) 90deg 120deg, rgba(255,255,0,0.15) 180deg 210deg, rgba(255,0,255,0.15) 270deg 300deg, rgba(0,255,0,0.15) 360deg);
      animation: ledLeftMove 4s linear infinite reverse;
      z-index: -2;
      filter: blur(12px);
    }

    /* Left side moving animation - only horizontal shift */
    @keyframes ledLeftMove {
      0% { transform: translateX(-20px); }
      50% { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }

    /* 4 LED dots inside - left side moving */
